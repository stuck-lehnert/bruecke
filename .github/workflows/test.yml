name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install shell test tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq
      - run: scripts/check
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run Go tests and PowerShell fixtures
        shell: powershell
        run: |
          go test -json ./... | Tee-Object -Variable testOutput
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) {
            $events = @($testOutput | ForEach-Object { $_ | ConvertFrom-Json })
            $failures = $events | Where-Object { $_.Action -eq 'fail' -and $_.Test }
            foreach ($failure in $failures) {
              $details = ($events | Where-Object {
                $_.Package -eq $failure.Package -and $_.Test -eq $failure.Test -and $_.Action -eq 'output'
              }).Output -join ''
              $message = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error::$message"
            }
          }
          exit $testExitCode
